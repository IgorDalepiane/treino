<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Treino" />
  <meta name="theme-color" content="#0b0d11" />
  <title>Treino</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app"></div>
  <div class="sheet hidden" id="video-sheet">
    <header>
      <strong id="video-title"></strong>
      <button class="icon-btn" id="video-close" type="button">OK</button>
    </header>
    <div class="player" id="video-player"></div>
  </div>
  <div class="sheet hidden" id="settings-sheet">
    <header>
      <strong>Dados</strong>
      <button class="icon-btn" id="settings-close" type="button">OK</button>
    </header>
    <div class="scroll file-row">
      <p class="muted">Os pesos ficam neste iPhone (Safari). Exporta um JSON se for apagar o site. O app nativo no Xcode não foi apagado — este JSON é o mesmo formato.</p>
      <button id="btn-export" type="button">Exportar JSON</button>
      <label>Importar JSON<input type="file" id="btn-import" accept="application/json,.json" hidden></label>
      <p class="muted" id="data-msg"></p>
    </div>
  </div>
  <script src="catalog.js"></script>
  <script src="videos.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
